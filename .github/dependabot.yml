version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    exclude-paths:
      - "repos/effect/**"
    groups:
      effect-cohort:
        applies-to: version-updates
        patterns:
          - "effect"
          - "@effect/platform-node"
          - "@effect/vitest"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
