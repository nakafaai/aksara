# Runs the local quality gate of README.md on one exact head, on demand, on
# GitHub's free public-repository runners, so content sessions stop running it on
# the shared Mac. Dispatch: `gh workflow run gate.yml --repo nakafaai/aksara -f sha=<head>`.
# It reads no secret, publishes nothing, and no ruleset names it: the statuses it
# posts on the head are evidence for the merge, never a required check.
name: Gate
run-name: Gate ${{ inputs.sha }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: The exact 40-character head to gate
        required: true
        type: string

permissions: {}

concurrency:
  group: gate-${{ inputs.sha }}
  cancel-in-progress: true

jobs:
  pending:
    name: Pending
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Mark the head pending
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full lower-case commit SHA." >&2; exit 1; }
          for context in gate gate/policies gate/typecheck gate/test gate/build gate/audit; do
            gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
              -f state=pending -f context="$context" -f target_url="$URL" -f description="Gating"
          done

  check:
    name: ${{ matrix.part }}
    needs: pending
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        part: [ policies, typecheck, test, build, audit ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ${{ matrix.part }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PART: ${{ matrix.part }}
        run: |
          case "$PART" in
            policies)
              bun run lint
              bun run deprecations
              bun run names
              bun run jsdocs
              bun run lines
              bun run boundaries
              bun run locales
              bun run points
              bun run visuals
              bun run voice
              bun run workflows
              bun run native
              ;;
            typecheck) bun run typecheck ;;
            test) bun run test ;;
            build)
              bun run build
              bun run verify:consumer
              ;;
            audit) bun run security:audit ;;
          esac

  report:
    name: Report
    needs: [ pending, check ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      statuses: write
    steps:
      - name: Post the statuses
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=50")
          all=success
          for part in policies typecheck test build audit; do
            conclusion=$(echo "$jobs" | jq -r --arg p "$part" '.jobs[] | select(.name == $p) | .conclusion')
            state=failure
            [ "$conclusion" = success ] && state=success
            [ "$state" = success ] || all=failure
            gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
              -f state="$state" -f context="gate/$part" -f target_url="$URL" -f description="${conclusion:-did not run}"
            echo "| $part | $state |" >> "$GITHUB_STEP_SUMMARY"
          done
          gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$all" -f context=gate -f target_url="$URL" -f description="README quality gate: $all"
