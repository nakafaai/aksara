name: Adopt historical renderer metadata

# Delete this workflow and its draft evidence release after both historical
# snapshots have passed the separately authenticated learner-pointer CAS.
on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: Reviewed historical snapshot
        required: true
        type: choice
        options:
          - "0"
          - "1"

permissions: {}

concurrency:
  group: content-production
  cancel-in-progress: false

jobs:
  stage:
    if: github.ref == 'refs/heads/main' && github.repository == 'nakafaai/aksara'
    environment: content-production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup toolchain
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify administrative boundary
        run: |
          pnpm security:audit
          pnpm lint
          pnpm typecheck:root
          pnpm exec turbo run typecheck test build --filter=@nakafa/aksara-publisher...

      - name: Prove published contract archive
        env:
          CURRENT_ARCHIVE: ${{ runner.temp }}/nakafa-aksara-contracts.tgz
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm --filter @nakafa/aksara-contracts verify:consumer --output "$CURRENT_ARCHIVE"
          node packages/contracts/scripts/release/command.ts prove \
            --archive "$CURRENT_ARCHIVE" --repository "$GITHUB_REPOSITORY" \
            --source-sha "$GITHUB_SHA"

      - name: Download reviewed original source evidence
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_ROOT: ${{ runner.temp }}/renderer-history
        run: |
          mkdir -p "$EVIDENCE_ROOT"
          gh release view renderer-history-20260913 --repo "$GITHUB_REPOSITORY" \
            --json isDraft --jq '.isDraft' | grep -Fx true
          gh release download renderer-history-20260913 --repo "$GITHUB_REPOSITORY" \
            --pattern history.json.gz --dir "$EVIDENCE_ROOT"
          printf '%s  %s\n' \
            f219beb5a2ca45601157673deb6eef75d8285dc4c54bd4c8d671d8ece0e51bab \
            "$EVIDENCE_ROOT/history.json.gz" | sha256sum --check --strict

      - name: Reverify original signatures and exact Git sources
        env:
          ADOPTION_MODE: verify
          ADOPTION_INDEX: ${{ inputs.snapshot }}
          ADOPTION_EVIDENCE: ${{ runner.temp }}/renderer-history/history.json.gz
          ADOPTION_REPORT: ${{ runner.temp }}/renderer-history/normalized.json
          ADOPTION_REPOSITORY: ${{ github.workspace }}
        run: pnpm exec node --conditions=aksara-source packages/publisher/scripts/adoption.ts

      - name: Stage and verify without activating
        env:
          ADOPTION_MODE: stage
          ADOPTION_INDEX: ${{ inputs.snapshot }}
          ADOPTION_EVIDENCE: ${{ runner.temp }}/renderer-history/history.json.gz
          ADOPTION_REPORT: ${{ runner.temp }}/renderer-history/staged.json
          ADOPTION_REPOSITORY: ${{ github.workspace }}
          ADOPTION_RELEASE_ID: renderer-history-20260913-${{ inputs.snapshot }}
          AKSARA_PUBLICATION_ENDPOINT: ${{ vars.AKSARA_PUBLICATION_ENDPOINT }}
          AKSARA_PUBLICATION_TOKEN: ${{ secrets.AKSARA_PUBLICATION_TOKEN }}
          AKSARA_SIGNING_KEY_ID: ${{ vars.AKSARA_SIGNING_KEY_ID }}
          AKSARA_SIGNING_PRIVATE_KEY: ${{ secrets.AKSARA_SIGNING_PRIVATE_KEY }}
        run: pnpm exec node --conditions=aksara-source packages/publisher/scripts/adoption.ts

      - name: Retain signed adoption proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: renderer-history-${{ inputs.snapshot }}
          path: ${{ runner.temp }}/renderer-history/staged.json
          if-no-files-found: error
          retention-days: 3
