name: Publish content to development

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Publication operation
        required: true
        type: choice
        options:
          - accept
          - release
      release_id:
        description: Exact release ID for the requested operation
        required: true
        type: string
      recovery_id:
        description: Exact retained inverse ID for release or accept
        required: true
        type: string
      scope:
        description: Canonical family or snapshot selectors as a JSON string array (release only)
        required: false
        type: string

permissions: {}

concurrency:
  group: content-development
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main'
      && github.repository == 'nakafaai/aksara'
    environment: content-production
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Validate operation
        env:
          OPERATION: ${{ inputs.operation }}
          RECOVERY_ID: ${{ inputs.recovery_id }}
          RELEASE_ID: ${{ inputs.release_id }}
          PUBLICATION_SCOPE: ${{ inputs.scope }}
        run: |
          if [[ -z "$RECOVERY_ID" ]]; then
            echo "The operation must name its exact retained inverse." >&2
            exit 1
          fi
          if [[ "$RECOVERY_ID" == "$RELEASE_ID" ]]; then
            echo "Active and recovery release identities must differ." >&2
            exit 1
          fi
          if [[ "$OPERATION" == "release" ]]; then
            if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and length > 0)' <<<"$PUBLICATION_SCOPE" >/dev/null; then
              echo "A release must provide a non-empty JSON array of canonical scope selectors." >&2
              exit 1
            fi
          elif [[ -n "$PUBLICATION_SCOPE" ]]; then
            echo "Only release may select a publication scope." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup toolchain
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm security:audit

      - name: Verify exact main revision
        run: |
          if [[ -n "$(git status --porcelain=v1 --untracked-files=normal)" ]]; then
            echo "The reviewed development checkout is dirty." >&2
            exit 1
          fi
          git rev-parse --verify HEAD

      - name: Publish release to development
        if: inputs.operation == 'release'
        env:
          AKSARA_PUBLICATION_ENDPOINT: ${{ vars.AKSARA_DEV_PUBLICATION_ENDPOINT }}
          AKSARA_PUBLICATION_TOKEN: ${{ secrets.AKSARA_DEV_PUBLICATION_TOKEN }}
          AKSARA_RENDERER_ENDPOINT: ${{ vars.AKSARA_RENDERER_ENDPOINT }}
          AKSARA_RENDERER_TOKEN: ${{ secrets.AKSARA_PUBLICATION_TOKEN }}
          AKSARA_SIGNING_KEY_ID: ${{ vars.AKSARA_SIGNING_KEY_ID }}
          AKSARA_SIGNING_PRIVATE_KEY: ${{ secrets.AKSARA_SIGNING_PRIVATE_KEY }}
          RECOVERY_ID: ${{ inputs.recovery_id }}
          RELEASE_ID: ${{ inputs.release_id }}
          PUBLICATION_SCOPE: ${{ inputs.scope }}
        run: |
          mapfile -t SCOPE_SELECTORS < <(jq -er '.[]' <<<"$PUBLICATION_SCOPE")
          scope_args=()
          for selector in "${SCOPE_SELECTORS[@]}"; do
            scope_args+=(--scope "$selector")
          done
          pnpm release -- --release-id "$RELEASE_ID" \
            --recovery-id "$RECOVERY_ID" "${scope_args[@]}"

      - name: Accept active release on development
        if: inputs.operation == 'accept'
        env:
          AKSARA_PUBLICATION_ENDPOINT: ${{ vars.AKSARA_DEV_PUBLICATION_ENDPOINT }}
          AKSARA_PUBLICATION_TOKEN: ${{ secrets.AKSARA_DEV_PUBLICATION_TOKEN }}
          RECOVERY_ID: ${{ inputs.recovery_id }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: >-
          pnpm accept -- --release-id "$RELEASE_ID"
          --recovery-id "$RECOVERY_ID"
