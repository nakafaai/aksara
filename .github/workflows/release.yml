name: Release content
run-name: ${{ inputs.operation }} ${{ inputs.release_id }} (${{ inputs.target }})

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Publication operation
        required: true
        type: choice
        options:
          - accept
          - abort
          - cleanup
          - recover
          - release
      target:
        description: Production by default. Development alone publishes the commit this run is dispatched from to development, and nothing compares it with production. Both publishes the two together and proves that they match. Recovery, abort, and cleanup take one target.
        required: true
        default: production
        type: choice
        options:
          - production
          - development
          - both
      release_id:
        description: Exact release ID for the requested operation. For release, a fresh <slug>-YYYYMMDD identity that must differ from the recovery ID and the bootstrap base. For accept, recover, abort, or cleanup, the existing release that operation targets.
        required: true
        type: string
      recovery_id:
        description: Retained-inverse identity for release, accept, or recover. For release, a fresh identity, conventionally <release-id>-inverse, that must differ from both the release ID and the active base release. For accept or recover, the exact retained inverse staged alongside the candidate. A release that bootstraps over a retired base leaves it empty.
        required: false
        type: string
      bootstrap_over:
        description: Retired active release ID that a full-replacement release supersedes with no retained inverse, for the one-way content generation switch. Only release takes it, with one target and no recovery ID. Undo is a forward release of the last commit of the retired generation.
        required: false
        type: string
      rebuild:
        description: Recompile every authored item in the selected families
        required: false
        default: false
        type: boolean
      scope:
        description: Canonical family or snapshot selectors as a JSON string array
        required: false
        type: string

permissions: {}

concurrency:
  group: content-publication
  cancel-in-progress: false

jobs:
  contracts:
    if: >-
      github.ref == 'refs/heads/main'
      && github.repository == 'nakafaai/aksara'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: read
      contents: read
    steps:
      # The inputs are checked before any job spends time, so a malformed dispatch fails
      # in seconds instead of after the publication verification.
      - name: Validate target
        env:
          OPERATION: ${{ inputs.operation }}
          TARGET: ${{ inputs.target }}
        run: |
          case "$TARGET" in
            production|development|both) ;;
            *) echo "Unknown publication target." >&2; exit 1 ;;
          esac
          if [[ "$TARGET" == "both" && "$OPERATION" != "release" && "$OPERATION" != "accept" ]]; then
            echo "Recovery, abort, and cleanup take one target, not both." >&2
            exit 1
          fi

      - name: Validate operation
        env:
          BOOTSTRAP_OVER: ${{ inputs.bootstrap_over }}
          OPERATION: ${{ inputs.operation }}
          REBUILD: ${{ inputs.rebuild }}
          RECOVERY_ID: ${{ inputs.recovery_id }}
          RELEASE_ID: ${{ inputs.release_id }}
          PUBLICATION_SCOPE: ${{ inputs.scope }}
          TARGET: ${{ inputs.target }}
        run: |
          # A release keeps exactly one retained decision: its inverse, or the retired base it replaces.
          if [[ "$OPERATION" == "release" && -n "$BOOTSTRAP_OVER" ]]; then
            if [[ -n "$RECOVERY_ID" ]]; then
              echo "A release names either its retained inverse or its bootstrap base, not both." >&2
              exit 1
            fi
            if [[ "$BOOTSTRAP_OVER" == "$RELEASE_ID" ]]; then
              echo "Release and bootstrap base identities must differ." >&2
              exit 1
            fi
            if [[ "$TARGET" == "both" ]]; then
              echo "A bootstrap takes one target, not both." >&2
              exit 1
            fi
          elif [[ -n "$BOOTSTRAP_OVER" ]]; then
            echo "Only release may bootstrap over a retired base." >&2
            exit 1
          elif [[ "$OPERATION" == "release" || "$OPERATION" == "accept" || "$OPERATION" == "recover" ]]; then
            if [[ -z "$RECOVERY_ID" ]]; then
              if [[ "$OPERATION" == "release" ]]; then
                echo "A release must name its exact retained inverse or the retired base it bootstraps over." >&2
              else
                echo "The operation must name its exact retained inverse." >&2
              fi
              exit 1
            fi
            if [[ "$RECOVERY_ID" == "$RELEASE_ID" ]]; then
              echo "Active and recovery release identities must differ." >&2
              exit 1
            fi
          elif [[ -n "$RECOVERY_ID" ]]; then
            echo "Abort and cleanup do not accept a recovery identity." >&2
            exit 1
          fi
          if [[ "$OPERATION" == "release" ]]; then
            if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and length > 0)' <<<"$PUBLICATION_SCOPE" >/dev/null; then
              echo "A release must provide a non-empty JSON array of canonical scope selectors." >&2
              exit 1
            fi
          elif [[ -n "$PUBLICATION_SCOPE" ]]; then
            echo "Only release may select a publication scope." >&2
            exit 1
          fi
          if [[ "$OPERATION" != "release" && "$REBUILD" == "true" ]]; then
            echo "Only release may rebuild selected families." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun run security:audit

      - name: Build exact contract archive
        env:
          TARBALL: ${{ runner.temp }}/nakafa-aksara-contracts.tgz
        run: >-
          bun run --filter @nakafa/aksara-contracts verify:consumer --output "$TARBALL"

      - name: Prove immutable contract release
        env:
          CURRENT_ARCHIVE: ${{ runner.temp }}/nakafa-aksara-contracts.tgz
          GH_TOKEN: ${{ github.token }}
        run: >-
          node packages/contracts/scripts/release/command.ts prove
          --archive "$CURRENT_ARCHIVE"
          --repository "$GITHUB_REPOSITORY"
          --source-sha "$GITHUB_SHA"

  verify:
    needs: contracts
    if: >-
      github.ref == 'refs/heads/main'
      && github.repository == 'nakafaai/aksara'
      && needs.contracts.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun run security:audit

      - name: Verify exact main revision
        run: |
          if [[ -n "$(git status --porcelain=v1 --untracked-files=normal)" ]]; then
            echo "The reviewed production checkout is dirty." >&2
            exit 1
          fi
          git rev-parse --verify HEAD

      # The workflow check imports the contracts package, which resolves to its
      # build output, so the package is built before the checks run.
      - name: Build contracts for the repository checks
        run: bun run --filter @nakafa/aksara-contracts build

      - name: Verify repository controls
        run: |
          bun run lint
          bun run names
          bun run jsdocs
          bun run lines
          bun run locales
          bun run points
          bun run workflows
          bun run boundaries

      - name: Verify full publication revision
        if: inputs.operation == 'accept' || inputs.operation == 'release'
        run: |
          bun run deprecations
          bun run typecheck
          bun run test
          bun run build
          bun run verify:consumer

      - name: Verify terminal operation revision
        if: inputs.operation == 'abort' || inputs.operation == 'cleanup' || inputs.operation == 'recover'
        run: |
          # Package test tasks do not reach the root suites, so name them here.
          bunx turbo run test:root test:lesson-voice --filter=// --concurrency=1
          # One task at a time, as the root test script runs them: on a two-core
          # runner concurrent suites starve the fixture tests past their timeout.
          bunx turbo run typecheck test build \
            --filter=@nakafa/aksara-contracts \
            --filter=@nakafa/aksara-publisher \
            --filter=@nakafa/aksara-cli \
            --concurrency=1
          bun run deprecations:audit

  operate:
    name: ${{ inputs.operation }} (${{ matrix.target }})
    needs: [ contracts, verify ]
    strategy:
      fail-fast: false
      matrix:
        # One leg for production or development alone, two legs for both.
        target: ${{ fromJSON(inputs.target == 'both' && '["development","production"]' || format('["{0}"]', inputs.target)) }}
    if: >-
      github.ref == 'refs/heads/main'
      && github.repository == 'nakafaai/aksara'
      && needs.contracts.result == 'success'
      && needs.verify.result == 'success'
    environment: content-production
    runs-on: ubuntu-latest
    # Full rebuilds must cover validation, candidate upload, retained-inverse
    # upload, two bounded proof passes, activation, and compensation.
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun run security:audit

      - name: Verify exact main revision
        run: |
          if [[ -n "$(git status --porcelain=v1 --untracked-files=normal)" ]]; then
            echo "The reviewed production checkout is dirty." >&2
            exit 1
          fi
          git rev-parse --verify HEAD

      - name: Prepare isolated operation checkout
        env:
          OPERATION_ROOT: ${{ runner.temp }}/aksara-operation
        run: |
          git worktree add --detach "$OPERATION_ROOT" "$GITHUB_SHA"
          bun install --cwd "$OPERATION_ROOT" --frozen-lockfile
          if [[ "$(git -C "$OPERATION_ROOT" rev-parse --verify HEAD)" != "$GITHUB_SHA" ]]; then
            echo "The isolated operation checkout does not match the reviewed workflow revision." >&2
            exit 1
          fi
          if [[ -n "$(git -C "$OPERATION_ROOT" status --porcelain=v1 --untracked-files=normal)" ]]; then
            echo "The isolated operation checkout is dirty." >&2
            exit 1
          fi

      # A production release or recovery runs Nakafa's deploy workflow. The deploy
      # app's installation token reaches only that repository's Actions, and it
      # expires within the hour.
      - name: Create the Nakafa deploy token
        id: nakafa-deploy
        if: matrix.target == 'production' && (inputs.operation == 'release' || inputs.operation == 'recover')
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.NAKAFA_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.NAKAFA_DEPLOY_APP_PRIVATE_KEY }}
          owner: nakafaai
          repositories: nakafa.com
          permission-actions: write

      - name: Publish release
        if: inputs.operation == 'release'
        working-directory: ${{ runner.temp }}/aksara-operation
        env:
          AKSARA_PUBLICATION_ENDPOINT: ${{ vars[matrix.target == 'development' && 'AKSARA_DEV_PUBLICATION_ENDPOINT' || 'AKSARA_PUBLICATION_ENDPOINT'] }}
          AKSARA_PUBLICATION_TOKEN: ${{ secrets[matrix.target == 'development' && 'AKSARA_DEV_PUBLICATION_TOKEN' || 'AKSARA_PUBLICATION_TOKEN'] }}
          NAKAFA_DEPLOY_SURFACE: ${{ matrix.target == 'development' && 'none' || 'deployed' }}
          NAKAFA_DEPLOY_TOKEN: ${{ steps.nakafa-deploy.outputs.token }}
          AKSARA_RENDERER_ENDPOINT: ${{ vars.AKSARA_RENDERER_ENDPOINT }}
          AKSARA_RENDERER_TOKEN: ${{ secrets.AKSARA_PUBLICATION_TOKEN }}
          AKSARA_SIGNING_KEY_ID: ${{ vars.AKSARA_SIGNING_KEY_ID }}
          AKSARA_SIGNING_PRIVATE_KEY: ${{ secrets.AKSARA_SIGNING_PRIVATE_KEY }}
          BOOTSTRAP_OVER: ${{ inputs.bootstrap_over }}
          RECOVERY_ID: ${{ inputs.recovery_id }}
          RELEASE_ID: ${{ inputs.release_id }}
          PUBLICATION_SCOPE: ${{ inputs.scope }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          mapfile -t SCOPE_SELECTORS < <(jq -er '.[]' <<<"$PUBLICATION_SCOPE")
          scope_args=()
          for selector in "${SCOPE_SELECTORS[@]}"; do
            scope_args+=(--scope "$selector")
          done
          rebuild_args=()
          if [[ "$REBUILD" == "true" ]]; then
            rebuild_args+=(--rebuild)
          fi
          if [[ -n "$BOOTSTRAP_OVER" ]]; then
            retention_args=(--bootstrap-over "$BOOTSTRAP_OVER")
          else
            retention_args=(--recovery-id "$RECOVERY_ID")
          fi
          bun run release -- --release-id "$RELEASE_ID" \
            "${retention_args[@]}" "${scope_args[@]}" "${rebuild_args[@]}"

      # Only an acceptance of both targets compares them. One target accepts
      # alone, because the other deployment may not hold the release yet.
      - name: Verify paired acceptance
        if: inputs.operation == 'accept' && inputs.target == 'both'
        working-directory: ${{ runner.temp }}/aksara-operation
        env:
          AKSARA_DEV_PUBLICATION_ENDPOINT: ${{ vars.AKSARA_DEV_PUBLICATION_ENDPOINT }}
          AKSARA_DEV_PUBLICATION_TOKEN: ${{ secrets.AKSARA_DEV_PUBLICATION_TOKEN }}
          AKSARA_PUBLICATION_ENDPOINT: ${{ vars.AKSARA_PUBLICATION_ENDPOINT }}
          AKSARA_PUBLICATION_TOKEN: ${{ secrets.AKSARA_PUBLICATION_TOKEN }}
          RECOVERY_ID: ${{ inputs.recovery_id }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: >-
          bun run parity -- --release-id "$RELEASE_ID"
          --recovery-id "$RECOVERY_ID"

      - name: Accept active release
        if: inputs.operation == 'accept'
        working-directory: ${{ runner.temp }}/aksara-operation
        env:
          AKSARA_PUBLICATION_ENDPOINT: ${{ vars[matrix.target == 'development' && 'AKSARA_DEV_PUBLICATION_ENDPOINT' || 'AKSARA_PUBLICATION_ENDPOINT'] }}
          AKSARA_PUBLICATION_TOKEN: ${{ secrets[matrix.target == 'development' && 'AKSARA_DEV_PUBLICATION_TOKEN' || 'AKSARA_PUBLICATION_TOKEN'] }}
          RECOVERY_ID: ${{ inputs.recovery_id }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: >-
          bun run accept -- --release-id "$RELEASE_ID"
          --recovery-id "$RECOVERY_ID"

      - name: Recover active release
        if: inputs.operation == 'recover'
        working-directory: ${{ runner.temp }}/aksara-operation
        env:
          AKSARA_PUBLICATION_ENDPOINT: ${{ vars[matrix.target == 'development' && 'AKSARA_DEV_PUBLICATION_ENDPOINT' || 'AKSARA_PUBLICATION_ENDPOINT'] }}
          AKSARA_PUBLICATION_TOKEN: ${{ secrets[matrix.target == 'development' && 'AKSARA_DEV_PUBLICATION_TOKEN' || 'AKSARA_PUBLICATION_TOKEN'] }}
          NAKAFA_DEPLOY_SURFACE: ${{ matrix.target == 'development' && 'none' || 'deployed' }}
          NAKAFA_DEPLOY_TOKEN: ${{ steps.nakafa-deploy.outputs.token }}
          AKSARA_RENDERER_ENDPOINT: ${{ vars.AKSARA_RENDERER_ENDPOINT }}
          AKSARA_RENDERER_TOKEN: ${{ secrets.AKSARA_PUBLICATION_TOKEN }}
          RECOVERY_ID: ${{ inputs.recovery_id }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: >-
          bun run recover -- --release-id "$RELEASE_ID"
          --recovery-id "$RECOVERY_ID"

      - name: Clean unreachable release
        if: inputs.operation == 'cleanup'
        working-directory: ${{ runner.temp }}/aksara-operation
        env:
          AKSARA_PUBLICATION_ENDPOINT: ${{ vars[matrix.target == 'development' && 'AKSARA_DEV_PUBLICATION_ENDPOINT' || 'AKSARA_PUBLICATION_ENDPOINT'] }}
          AKSARA_PUBLICATION_TOKEN: ${{ secrets[matrix.target == 'development' && 'AKSARA_DEV_PUBLICATION_TOKEN' || 'AKSARA_PUBLICATION_TOKEN'] }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: bun run cleanup -- --release-id "$RELEASE_ID"

      - name: Abort pending release
        if: inputs.operation == 'abort'
        working-directory: ${{ runner.temp }}/aksara-operation
        env:
          AKSARA_PUBLICATION_ENDPOINT: ${{ vars[matrix.target == 'development' && 'AKSARA_DEV_PUBLICATION_ENDPOINT' || 'AKSARA_PUBLICATION_ENDPOINT'] }}
          AKSARA_PUBLICATION_TOKEN: ${{ secrets[matrix.target == 'development' && 'AKSARA_DEV_PUBLICATION_TOKEN' || 'AKSARA_PUBLICATION_TOKEN'] }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: bun run abort -- --release-id "$RELEASE_ID"

  # Runs only when both targets were published together. A release to one
  # target has no peer to compare, so nothing waits for the other deployment.
  parity:
    needs: operate
    if: >-
      github.ref == 'refs/heads/main'
      && github.repository == 'nakafaai/aksara'
      && needs.operate.result == 'success'
      && inputs.target == 'both'
      && (inputs.operation == 'release' || inputs.operation == 'accept')
    environment: content-production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify paired result
        env:
          AKSARA_DEV_PUBLICATION_ENDPOINT: ${{ vars.AKSARA_DEV_PUBLICATION_ENDPOINT }}
          AKSARA_DEV_PUBLICATION_TOKEN: ${{ secrets.AKSARA_DEV_PUBLICATION_TOKEN }}
          AKSARA_PUBLICATION_ENDPOINT: ${{ vars.AKSARA_PUBLICATION_ENDPOINT }}
          AKSARA_PUBLICATION_TOKEN: ${{ secrets.AKSARA_PUBLICATION_TOKEN }}
          RECOVERY_ID: ${{ inputs.recovery_id }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: >-
          bun run parity -- --release-id "$RELEASE_ID"
          --recovery-id "$RECOVERY_ID"
