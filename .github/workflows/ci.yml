name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup toolchain
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm security:audit

      - name: Capture immutable contract releases
        env:
          CONTRACT_RELEASES: ${{ runner.temp }}/contract-releases.tsv
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --paginate
          "repos/$GITHUB_REPOSITORY/releases?per_page=100"
          --jq '.[] | select(.draft == false and .immutable == true and
          .prerelease == false) | .tag_name as $tag | .assets[] |
          select(.name | test("^nakafa-aksara-contracts-(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.tgz$")) |
          [$tag, .name] | @tsv' > "$CONTRACT_RELEASES"

      - name: Contract release identity
        id: identity
        env:
          CONTRACT_RELEASES: ${{ runner.temp }}/contract-releases.tsv
        run: >-
          node packages/contracts/scripts/release/command.ts describe
          --releases "$CONTRACT_RELEASES" --output "$GITHUB_OUTPUT"

      - name: Lint
        run: pnpm lint

      - name: Deprecated APIs
        run: pnpm deprecations

      - name: File names
        run: pnpm names

      - name: Function documentation
        run: pnpm jsdocs

      - name: Module size
        run: pnpm lines

      - name: Locale source policy
        run: pnpm locales

      - name: Workflow policy
        run: pnpm workflows

      - name: Workspace boundaries
        run: pnpm boundaries

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify contracts release archive
        env:
          CURRENT_ARCHIVE: ${{ runner.temp }}/${{ steps.identity.outputs.asset_name }}
        run: pnpm verify:consumer -- --output "$CURRENT_ARCHIVE"

      - name: Download latest immutable archive
        if: steps.identity.outputs.has_latest == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST_ASSET: ${{ steps.identity.outputs.latest_asset_name }}
          LATEST_ROOT: ${{ runner.temp }}/latest-contract
          LATEST_TAG: ${{ steps.identity.outputs.latest_tag }}
        run: |
          release=$(gh release view "$LATEST_TAG" \
            --json isDraft,isImmutable,isPrerelease \
            --repo "$GITHUB_REPOSITORY")
          if ! jq -e \
            '.isDraft == false
              and .isImmutable == true
              and .isPrerelease == false' \
            <<< "$release" >/dev/null; then
            echo "The latest contract tag must own a final immutable release." >&2
            exit 1
          fi
          mkdir -p "$LATEST_ROOT"
          gh release download "$LATEST_TAG" --clobber \
            --dir "$LATEST_ROOT" --pattern "$LATEST_ASSET" \
            --repo "$GITHUB_REPOSITORY"

      - name: Verify exact archive release identity
        env:
          CONTRACT_RELEASES: ${{ runner.temp }}/contract-releases.tsv
          CURRENT_ARCHIVE: ${{ runner.temp }}/${{ steps.identity.outputs.asset_name }}
          HAS_LATEST: ${{ steps.identity.outputs.has_latest }}
          LATEST_ARCHIVE: ${{ runner.temp }}/latest-contract/${{ steps.identity.outputs.latest_asset_name }}
        run: |
          arguments=(decide --releases "$CONTRACT_RELEASES" \
            --archive "$CURRENT_ARCHIVE" --output "$GITHUB_OUTPUT")
          if [[ "$HAS_LATEST" == "true" ]]; then
            arguments+=(--previous "$LATEST_ARCHIVE")
          fi
          node packages/contracts/scripts/release/command.ts "${arguments[@]}"
