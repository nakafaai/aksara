name: Recover try-out history

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Exact try-out recovery operation
        required: true
        type: choice
        options:
          - genesis
          - migrate
          - cleanup
          - abort
      migration_id:
        description: Exact recovery operation identity
        required: true
        type: string

permissions: {}

concurrency:
  group: content-production
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.ref == 'refs/heads/main'
      && github.repository == 'nakafaai/aksara'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      attestations: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup toolchain
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm security:audit

      - name: Verify exact main revision
        run: |
          if [[ -n "$(git status --porcelain=v1 --untracked-files=normal)" ]]; then
            echo "The reviewed migration checkout is dirty." >&2
            exit 1
          fi
          if [[ "$(git rev-parse --verify HEAD)" != "$GITHUB_SHA" ]]; then
            echo "The migration checkout does not match the workflow revision." >&2
            exit 1
          fi

      - name: Verify repository controls
        run: |
          pnpm lint
          pnpm names
          pnpm jsdocs
          pnpm lines
          pnpm locales
          pnpm workflows
          pnpm boundaries

      - name: Verify migration revision
        run: |
          pnpm exec turbo run typecheck test build \
            --filter=@nakafa/aksara-contracts \
            --filter=@nakafa/aksara-publisher \
            --filter=@nakafa/aksara-cli
          pnpm deprecations:audit

      - name: Build exact contract archive
        env:
          TARBALL: ${{ runner.temp }}/nakafa-aksara-contracts.tgz
        run: >-
          pnpm --filter @nakafa/aksara-contracts verify:consumer --output "$TARBALL"

      - name: Prove immutable contract release
        env:
          CURRENT_ARCHIVE: ${{ runner.temp }}/nakafa-aksara-contracts.tgz
          GH_TOKEN: ${{ github.token }}
        run: >-
          node packages/contracts/scripts/release-command.ts prove
          --archive "$CURRENT_ARCHIVE"
          --repository "$GITHUB_REPOSITORY"
          --source-sha "$GITHUB_SHA"

  abort:
    needs: verify
    if: >-
      github.ref == 'refs/heads/main'
      && github.repository == 'nakafaai/aksara'
      && inputs.operation == 'abort'
      && needs.verify.result == 'success'
    environment: content-production
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup toolchain
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true
          install: false

      - name: Verify exact main revision
        run: |
          if [[ -n "$(git status --porcelain=v1 --untracked-files=normal)" ]]; then
            echo "The reviewed abort checkout is dirty." >&2
            exit 1
          fi
          if [[ "$(git rev-parse --verify HEAD)" != "$GITHUB_SHA" ]]; then
            echo "The abort checkout does not match the workflow revision." >&2
            exit 1
          fi

      - name: Prepare isolated abort checkout
        env:
          OPERATION_ROOT: ${{ runner.temp }}/aksara-abort
        run: |
          git worktree add --detach "$OPERATION_ROOT" "$GITHUB_SHA"
          pnpm --dir "$OPERATION_ROOT" install --frozen-lockfile
          if [[ "$(git -C "$OPERATION_ROOT" rev-parse --verify HEAD)" != "$GITHUB_SHA" ]]; then
            echo "The isolated abort checkout does not match the reviewed revision." >&2
            exit 1
          fi
          if [[ -n "$(git -C "$OPERATION_ROOT" status --porcelain=v1 --untracked-files=normal)" ]]; then
            echo "The isolated abort checkout is dirty." >&2
            exit 1
          fi

      - name: Abort invisible migration staging
        working-directory: ${{ runner.temp }}/aksara-abort
        env:
          AKSARA_PUBLICATION_ENDPOINT: ${{ vars.AKSARA_PUBLICATION_ENDPOINT }}
          AKSARA_PUBLICATION_TOKEN: ${{ secrets.AKSARA_PUBLICATION_TOKEN }}
          MIGRATION_ID: ${{ inputs.migration_id }}
        run: >-
          pnpm --filter @nakafa/aksara-cli migrate:abort
          --release-id "$MIGRATION_ID"

  seal:
    needs: verify
    if: >-
      github.ref == 'refs/heads/main'
      && github.repository == 'nakafaai/aksara'
      && (inputs.operation == 'migrate' || inputs.operation == 'genesis')
      && needs.verify.result == 'success'
    environment: content-production
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      attestations: write
      contents: read
      id-token: write
    outputs:
      asset_hash: ${{ steps.identity.outputs.asset_hash }}
      asset_name: ${{ steps.identity.outputs.asset_name }}
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
      release_tag: ${{ steps.identity.outputs.release_tag }}
      size: ${{ steps.identity.outputs.size }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup toolchain
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true
          install: false

      - name: Verify exact main revision
        run: |
          if [[ -n "$(git status --porcelain=v1 --untracked-files=normal)" ]]; then
            echo "The reviewed migration checkout is dirty." >&2
            exit 1
          fi
          if [[ "$(git rev-parse --verify HEAD)" != "$GITHUB_SHA" ]]; then
            echo "The migration checkout does not match the workflow revision." >&2
            exit 1
          fi

      - name: Prepare isolated recovery checkout
        env:
          OPERATION_ROOT: ${{ runner.temp }}/aksara-recovery
        run: |
          git worktree add --detach "$OPERATION_ROOT" "$GITHUB_SHA"
          pnpm --dir "$OPERATION_ROOT" install --frozen-lockfile
          if [[ "$(git -C "$OPERATION_ROOT" rev-parse --verify HEAD)" != "$GITHUB_SHA" ]]; then
            echo "The isolated migration checkout does not match the reviewed revision." >&2
            exit 1
          fi
          if [[ -n "$(git -C "$OPERATION_ROOT" status --porcelain=v1 --untracked-files=normal)" ]]; then
            echo "The isolated migration checkout is dirty." >&2
            exit 1
          fi

      - name: Prepare sealed asset directory
        run: mkdir -p "${{ runner.temp }}/sealed"

      - name: Seal signed migration receipt
        if: inputs.operation == 'migrate'
        working-directory: ${{ runner.temp }}/aksara-recovery
        env:
          AKSARA_PUBLICATION_ENDPOINT: ${{ vars.AKSARA_PUBLICATION_ENDPOINT }}
          AKSARA_PUBLICATION_TOKEN: ${{ secrets.AKSARA_PUBLICATION_TOKEN }}
          AKSARA_RENDERER_ENDPOINT: ${{ vars.AKSARA_RENDERER_ENDPOINT }}
          AKSARA_RENDERER_TOKEN: ${{ secrets.AKSARA_RENDERER_TOKEN }}
          AKSARA_SIGNING_KEY_ID: ${{ vars.AKSARA_SIGNING_KEY_ID }}
          AKSARA_SIGNING_PRIVATE_KEY: ${{ secrets.AKSARA_SIGNING_PRIVATE_KEY }}
          MIGRATION_ID: ${{ inputs.migration_id }}
          RECEIPT: ${{ runner.temp }}/sealed/receipt.json
        run: >-
          pnpm --filter @nakafa/aksara-cli migrate
          --release-id "$MIGRATION_ID" --receipt-path "$RECEIPT"

      - name: Seal signed genesis bundle
        if: inputs.operation == 'genesis'
        working-directory: ${{ runner.temp }}/aksara-recovery
        env:
          AKSARA_SIGNING_KEY_ID: ${{ vars.AKSARA_SIGNING_KEY_ID }}
          AKSARA_SIGNING_PRIVATE_KEY: ${{ secrets.AKSARA_SIGNING_PRIVATE_KEY }}
          BUNDLE: ${{ runner.temp }}/sealed/bundle.json
        run: >-
          pnpm --filter @nakafa/aksara-cli genesis
          --bundle-path "$BUNDLE"

      - name: Resolve signed asset identity
        id: identity
        env:
          BUNDLE: ${{ runner.temp }}/sealed/bundle.json
          EXPECTED_KEY_ID: ${{ vars.AKSARA_SIGNING_KEY_ID }}
          MIGRATION_ID: ${{ inputs.migration_id }}
          OPERATION: ${{ inputs.operation }}
          RECEIPT: ${{ runner.temp }}/sealed/receipt.json
        run: |
          if [[ ! "$MIGRATION_ID" =~ ^[a-z0-9][a-z0-9._-]{0,127}$ ]]; then
            echo "The recovery operation requires one canonical identity." >&2
            exit 1
          fi

          if [[ "$OPERATION" == "migrate" ]]; then
            receipt_migration_id=$(jq -er '.payload.migrationId' "$RECEIPT")
            if [[ "$receipt_migration_id" != "$MIGRATION_ID" ]]; then
              echo "The signed receipt does not own the requested migration." >&2
              exit 1
            fi
            asset="$RECEIPT"
            asset_name="receipt.json"
            release_tag="migration-$receipt_migration_id"
          elif [[ "$OPERATION" == "genesis" ]]; then
            if [[ "$MIGRATION_ID" != "genesis-six-scope-v013-20260814-e3a7f1e" ]]; then
              echo "Genesis signing requires the exact reviewed release identity." >&2
              exit 1
            fi
            if ! jq -e \
              --arg bundle_hash "sha256:6613c0fe37c6fbc94bc88fa59bacf20d664f6568f8da4dab8347396685573bd1" \
              --arg catalog_digest "sha256:4a4528d39855367f1a2338e0cdfb1767aa17f22195817c3351ab6814acd027d5" \
              --arg key_id "$EXPECTED_KEY_ID" \
              --arg manifest_hash "sha256:bee5d6e2bd95d8088596766f9e5c138c2e2558d0db7bbc16b97e93868c388ede" \
              --arg placement_digest "sha256:8cb74256608c47cf10c0b0146fb07343cc20a392a88d6d54a5f678791b589a9c" \
              --arg release_id "$MIGRATION_ID" \
              --arg renderer_hash "sha256:e06c5326020aeb0c43c0c565948b18a111a4df009ff3b3fe5cd827f35f9275e7" \
              --arg snapshot_id "sha256:8947def031cc7046d2d488dac2d9058d13de8bb3aad2f76584f96fe5bd5fc813" \
              --arg source_sha "e3a7f1e05bc64e1439e54084f50f2ad6ce22cd79" \
              '(keys | sort) == ["bundleHash", "keyId", "payload", "signature"]
                and .bundleHash == $bundle_hash
                and .keyId == $key_id
                and (.signature | test("^[A-Za-z0-9_-]{86}$"))
                and (.payload | keys | sort) == ["format", "rendererManifestHash", "snapshot", "sourceGitSha", "sourceManifestHash", "sourceReleaseId"]
                and .payload.format == "signed-tryout-runtime-bundle"
                and .payload.rendererManifestHash == $renderer_hash
                and .payload.sourceGitSha == $source_sha
                and .payload.sourceManifestHash == $manifest_hash
                and .payload.sourceReleaseId == $release_id
                and (.payload.snapshot | keys | sort) == ["activeAppLocales", "catalogDigest", "counts", "format", "placementCount", "placementDigest", "routeCount", "snapshotId"]
                and .payload.snapshot.activeAppLocales == ["en", "id"]
                and .payload.snapshot.catalogDigest == $catalog_digest
                and .payload.snapshot.format == "localized-tryout-snapshot"
                and .payload.snapshot.placementCount == 840
                and .payload.snapshot.placementDigest == $placement_digest
                and .payload.snapshot.routeCount == 48
                and .payload.snapshot.snapshotId == $snapshot_id
                and (.payload.snapshot.counts | keys | sort) == ["country", "exam", "section", "set", "track"]
                and .payload.snapshot.counts == {"country": 2, "exam": 4, "section": 34, "set": 10, "track": 4}' \
              "$BUNDLE" >/dev/null; then
              echo "The signed genesis bundle differs from the reviewed production source." >&2
              exit 1
            fi
            asset="$BUNDLE"
            asset_name="bundle.json"
            release_tag="tryout-runtime-$MIGRATION_ID"
          else
            echo "The seal job received an unsupported recovery operation." >&2
            exit 1
          fi

          digest=$(sha256sum "$asset" | cut -d ' ' -f 1)
          size=$(stat --format='%s' "$asset")
          {
            echo "asset_hash=sha256:$digest"
            echo "asset_name=$asset_name"
            echo "asset_path=$asset"
            echo "artifact_name=sealed-$MIGRATION_ID"
            echo "release_tag=$release_tag"
            echo "size=$size"
          } >> "$GITHUB_OUTPUT"

      - name: Attest signed asset
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.identity.outputs.asset_path }}

      - name: Verify asset attestation
        env:
          ASSET: ${{ steps.identity.outputs.asset_path }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify "$ASSET"
          --repo "$GITHUB_REPOSITORY"
          --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/migration.yml"
          --source-digest "$GITHUB_SHA"
          --source-ref "refs/heads/main"

      - name: Upload signed asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          compression-level: 0
          if-no-files-found: error
          name: ${{ steps.identity.outputs.artifact_name }}
          path: ${{ steps.identity.outputs.asset_path }}
          retention-days: 1

  publish:
    needs: seal
    if: needs.seal.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: read
      contents: write
    steps:
      - name: Download signed asset
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.seal.outputs.artifact_name }}
          path: ${{ runner.temp }}/sealed-asset

      - name: Verify transported asset
        env:
          ASSET: ${{ runner.temp }}/sealed-asset/${{ needs.seal.outputs.asset_name }}
          EXPECTED_HASH: ${{ needs.seal.outputs.asset_hash }}
          EXPECTED_SIZE: ${{ needs.seal.outputs.size }}
          GH_TOKEN: ${{ github.token }}
        run: |
          actual_hash="sha256:$(sha256sum "$ASSET" | cut -d ' ' -f 1)"
          actual_size=$(stat --format='%s' "$ASSET")
          if [[ "$actual_hash" != "$EXPECTED_HASH" || "$actual_size" != "$EXPECTED_SIZE" ]]; then
            echo "The transported asset differs from the sealed output." >&2
            exit 1
          fi
          gh attestation verify "$ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/migration.yml" \
            --source-digest "$GITHUB_SHA" \
            --source-ref "refs/heads/main"

      - name: Resolve release state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.seal.outputs.release_tag }}
        run: |
          release=""
          if ! release=$(gh release view "$RELEASE_TAG" \
            --json isDraft,isImmutable,isPrerelease,targetCommitish \
            --repo "$GITHUB_REPOSITORY" 2>/dev/null); then
            release=""
          fi

          tag=""
          if ! tag=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
            2>/dev/null); then
            tag=""
          fi

          if [[ -z "$release" ]]; then
            if [[ -n "$tag" ]]; then
              echo "The recovery tag exists without a GitHub Release." >&2
              exit 1
            fi
            echo "mode=create" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          target=$(jq -r '.targetCommitish' <<< "$release")
          if [[ "$target" != "$GITHUB_SHA" ]]; then
            echo "The recovery release belongs to another source commit." >&2
            exit 1
          fi
          if [[ "$(jq -r '.isPrerelease' <<< "$release")" == "true" ]]; then
            echo "The recovery asset cannot be a prerelease." >&2
            exit 1
          fi
          if [[ -n "$tag" ]] && ! jq -e \
            --arg sha "$GITHUB_SHA" \
            '.object.type == "commit" and .object.sha == $sha' \
            <<< "$tag" >/dev/null; then
            echo "The recovery tag belongs to another source commit." >&2
            exit 1
          fi
          if [[ "$(jq -r '.isImmutable' <<< "$release")" == "true" ]]; then
            if [[ "$(jq -r '.isDraft' <<< "$release")" == "true" ]]; then
              echo "An immutable recovery release cannot remain a draft." >&2
              exit 1
            fi
            echo "mode=reuse" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh release delete "$RELEASE_TAG" --cleanup-tag \
            --repo "$GITHUB_REPOSITORY" --yes
          echo "mode=create" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        if: steps.state.outputs.mode == 'create'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.seal.outputs.release_tag }}
        run: >-
          gh release create "$RELEASE_TAG" --draft --latest=false
          --notes "Signed try-out recovery asset from Aksara commit $GITHUB_SHA."
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$RELEASE_TAG"

      - name: Attach signed asset
        if: steps.state.outputs.mode == 'create'
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ runner.temp }}/sealed-asset/${{ needs.seal.outputs.asset_name }}
          RELEASE_TAG: ${{ needs.seal.outputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" "$ASSET" --repo "$GITHUB_REPOSITORY"

      - name: Publish immutable release
        if: steps.state.outputs.mode == 'create'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.seal.outputs.release_tag }}
        run: >-
          gh release edit "$RELEASE_TAG" --draft=false --latest=false
          --repo "$GITHUB_REPOSITORY"

      - name: Verify public asset
        env:
          ASSET: ${{ runner.temp }}/sealed-asset/${{ needs.seal.outputs.asset_name }}
          ASSET_NAME: ${{ needs.seal.outputs.asset_name }}
          EXPECTED_HASH: ${{ needs.seal.outputs.asset_hash }}
          EXPECTED_SIZE: ${{ needs.seal.outputs.size }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.seal.outputs.release_tag }}
        run: |
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          if ! jq -e \
            --arg asset "$ASSET_NAME" \
            --arg digest "$EXPECTED_HASH" \
            --arg sha "$GITHUB_SHA" \
            --argjson size "$EXPECTED_SIZE" \
            --arg tag "$RELEASE_TAG" \
            '.draft == false
              and .immutable == true
              and .prerelease == false
              and .published_at != null
              and .tag_name == $tag
              and .target_commitish == $sha
              and (.assets | length) == 1
              and .assets[0].name == $asset
              and .assets[0].size == $size
              and .assets[0].digest == $digest' \
            <<< "$release" >/dev/null; then
            echo "The public recovery release differs from the sealed asset." >&2
            exit 1
          fi

          tag=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")
          if ! jq -e \
            --arg sha "$GITHUB_SHA" \
            '.object.type == "commit" and .object.sha == $sha' \
            <<< "$tag" >/dev/null; then
            echo "The recovery release tag does not target the reviewed commit." >&2
            exit 1
          fi

          gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          gh release verify-asset "$RELEASE_TAG" "$ASSET" \
            --repo "$GITHUB_REPOSITORY"
          gh attestation verify "$ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/migration.yml" \
            --source-digest "$GITHUB_SHA" \
            --source-ref "refs/heads/main"

      - name: Remove failed mutable release
        if: failure() && steps.state.outputs.mode == 'create'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.seal.outputs.release_tag }}
        run: |
          release=""
          if ! release=$(gh release view "$RELEASE_TAG" \
            --json isImmutable,targetCommitish \
            --repo "$GITHUB_REPOSITORY" 2>/dev/null); then
            release=""
          fi
          if [[ -z "$release" ]] || ! jq -e \
            --arg sha "$GITHUB_SHA" \
            '.isImmutable == false and .targetCommitish == $sha' \
            <<< "$release" >/dev/null; then
            exit 0
          fi

          tag=""
          if ! tag=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
            2>/dev/null); then
            tag=""
          fi
          if [[ -n "$tag" ]] && ! jq -e \
            --arg sha "$GITHUB_SHA" \
            '.object.type == "commit" and .object.sha == $sha' \
            <<< "$tag" >/dev/null; then
            exit 0
          fi
          gh release delete "$RELEASE_TAG" --cleanup-tag \
            --repo "$GITHUB_REPOSITORY" --yes

  cleanup:
    needs: [verify, seal, publish]
    if: >-
      always()
      && github.ref == 'refs/heads/main'
      && github.repository == 'nakafaai/aksara'
      && needs.verify.result == 'success'
      && (
        (
          inputs.operation == 'migrate'
          && needs.seal.result == 'success'
          && needs.publish.result == 'success'
        )
        || (
          inputs.operation == 'cleanup'
          && needs.seal.result == 'skipped'
          && needs.publish.result == 'skipped'
        )
      )
    environment: content-production
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      attestations: read
      contents: read
    steps:
      - name: Resolve public receipt identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          MIGRATION_ID: ${{ inputs.migration_id }}
        run: |
          if [[ ! "$MIGRATION_ID" =~ ^[a-z0-9][a-z0-9._-]{0,127}$ ]]; then
            echo "Cleanup requires one canonical migration identity." >&2
            exit 1
          fi
          release_tag="migration-$MIGRATION_ID"
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag")
          if ! jq -e \
            --arg asset "receipt.json" \
            --arg tag "$release_tag" \
            '.draft == false
              and .immutable == true
              and .prerelease == false
              and .published_at != null
              and .tag_name == $tag
              and (.target_commitish | test("^[0-9a-f]{40}$"))
              and (.assets | length) == 1
              and .assets[0].name == $asset
              and (.assets[0].digest | test("^sha256:[0-9a-f]{64}$"))
              and (.assets[0].size > 0)' \
            <<< "$release" >/dev/null; then
            echo "Cleanup requires one exact immutable public receipt." >&2
            exit 1
          fi

          source_sha=$(jq -er '.target_commitish' <<< "$release")
          tag=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release_tag")
          if ! jq -e \
            --arg sha "$source_sha" \
            '.object.type == "commit" and .object.sha == $sha' \
            <<< "$tag" >/dev/null; then
            echo "The cleanup release tag does not target its source commit." >&2
            exit 1
          fi

          {
            echo "asset_hash=$(jq -er '.assets[0].digest' <<< "$release")"
            echo "asset_name=$(jq -er '.assets[0].name' <<< "$release")"
            echo "release_tag=$release_tag"
            echo "size=$(jq -er '.assets[0].size' <<< "$release")"
            echo "source_sha=$source_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Download public receipt
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_ROOT: ${{ runner.temp }}/migration-release
          RELEASE_TAG: ${{ steps.identity.outputs.release_tag }}
        run: |
          mkdir -p "$RECEIPT_ROOT"
          gh release download "$RELEASE_TAG" --clobber \
            --dir "$RECEIPT_ROOT" --pattern "${{ steps.identity.outputs.asset_name }}" \
            --repo "$GITHUB_REPOSITORY"

      - name: Verify public release
        env:
          ASSET_NAME: ${{ steps.identity.outputs.asset_name }}
          EXPECTED_HASH: ${{ steps.identity.outputs.asset_hash }}
          EXPECTED_SIZE: ${{ steps.identity.outputs.size }}
          GH_TOKEN: ${{ github.token }}
          RECEIPT: ${{ runner.temp }}/migration-release/${{ steps.identity.outputs.asset_name }}
          RELEASE_TAG: ${{ steps.identity.outputs.release_tag }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
        run: |
          actual_hash="sha256:$(sha256sum "$RECEIPT" | cut -d ' ' -f 1)"
          actual_size=$(stat --format='%s' "$RECEIPT")
          if [[ "$actual_hash" != "$EXPECTED_HASH" || "$actual_size" != "$EXPECTED_SIZE" ]]; then
            echo "The public receipt differs from the sealed output." >&2
            exit 1
          fi

          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          if ! jq -e \
            --arg asset "$ASSET_NAME" \
            --arg digest "$EXPECTED_HASH" \
            --arg sha "$SOURCE_SHA" \
            --argjson size "$EXPECTED_SIZE" \
            --arg tag "$RELEASE_TAG" \
            '.draft == false
              and .immutable == true
              and .prerelease == false
              and .published_at != null
              and .tag_name == $tag
              and .target_commitish == $sha
              and (.assets | length) == 1
              and .assets[0].name == $asset
              and .assets[0].size == $size
              and .assets[0].digest == $digest' \
            <<< "$release" >/dev/null; then
            echo "Cleanup requires the exact immutable public receipt." >&2
            exit 1
          fi

          tag=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")
          if ! jq -e \
            --arg sha "$SOURCE_SHA" \
            '.object.type == "commit" and .object.sha == $sha' \
            <<< "$tag" >/dev/null; then
            echo "The cleanup release tag does not target the reviewed commit." >&2
            exit 1
          fi

          gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          gh release verify-asset "$RELEASE_TAG" "$RECEIPT" \
            --repo "$GITHUB_REPOSITORY"
          gh attestation verify "$RECEIPT" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/migration.yml" \
            --source-digest "$SOURCE_SHA" \
            --source-ref "refs/heads/main"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup toolchain
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true
          install: false

      - name: Verify exact main revision
        run: |
          if [[ -n "$(git status --porcelain=v1 --untracked-files=normal)" ]]; then
            echo "The reviewed cleanup checkout is dirty." >&2
            exit 1
          fi
          if [[ "$(git rev-parse --verify HEAD)" != "$GITHUB_SHA" ]]; then
            echo "The cleanup checkout does not match the workflow revision." >&2
            exit 1
          fi

      - name: Prepare isolated cleanup checkout
        env:
          OPERATION_ROOT: ${{ runner.temp }}/aksara-cleanup
        run: |
          git worktree add --detach "$OPERATION_ROOT" "$GITHUB_SHA"
          pnpm --dir "$OPERATION_ROOT" install --frozen-lockfile
          if [[ "$(git -C "$OPERATION_ROOT" rev-parse --verify HEAD)" != "$GITHUB_SHA" ]]; then
            echo "The isolated cleanup checkout does not match the reviewed revision." >&2
            exit 1
          fi
          if [[ -n "$(git -C "$OPERATION_ROOT" status --porcelain=v1 --untracked-files=normal)" ]]; then
            echo "The isolated cleanup checkout is dirty." >&2
            exit 1
          fi

      - name: Clean retained source
        working-directory: ${{ runner.temp }}/aksara-cleanup
        env:
          AKSARA_PUBLICATION_ENDPOINT: ${{ vars.AKSARA_PUBLICATION_ENDPOINT }}
          AKSARA_PUBLICATION_TOKEN: ${{ secrets.AKSARA_PUBLICATION_TOKEN }}
          ASSET_HASH: ${{ steps.identity.outputs.asset_hash }}
          MIGRATION_ID: ${{ inputs.migration_id }}
          RECEIPT: ${{ runner.temp }}/migration-release/${{ steps.identity.outputs.asset_name }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
        run: >-
          pnpm --filter @nakafa/aksara-cli migrate:cleanup
          --release-id "$MIGRATION_ID" --receipt-path "$RECEIPT"
          --asset-hash "$ASSET_HASH" --source-sha "$SOURCE_SHA"
