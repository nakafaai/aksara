packages:
  - apps/*
  - packages/*

engineStrict: true
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
savePrefix: ""

update:
  ignoreDeps:
    - '@effect/platform-node'
    - '@effect/tsgo'
    - '@effect/vitest'
    - '@biomejs/biome'
    - '@types/node'
    - '@typescript/native'
    - effect
    - node
    - typescript
    - ultracite

catalog:
  '@effect/platform-node': 4.0.0-rc.110
  '@effect/vitest': 4.0.0-rc.110
  '@mdx-js/mdx': 3.1.1
  '@types/estree-jsx': 1.0.5
  '@types/mdast': 4.0.4
  '@types/unist': 3.0.3
  '@vitest/coverage-istanbul': 4.1.11
  effect: 4.0.0-rc.110
  eslint-scope: 9.1.2
  estree-util-visit: 2.0.0
  mdast-util-mdx: 3.0.0
  mdast-util-to-string: 4.0.0
  remark-gfm: 4.0.1
  remark-math: 6.0.0
  typescript: npm:@typescript/typescript6@6.0.2
  unified: 11.0.5
  unist-util-visit: 5.1.0
  vitest: 4.1.11

overrides:
  'postcss@8.5.25>nanoid': 3.3.18
  postcss: 8.5.25
  undici: 7.29.0

allowBuilds:
  '@parcel/watcher': false
  msgpackr-extract: false

minimumReleaseAgeExclude:
  - '@biomejs/biome@2.5.10'
  - '@biomejs/cli-darwin-arm64@2.5.10'
  - '@biomejs/cli-darwin-x64@2.5.10'
  - '@biomejs/cli-linux-arm64-musl@2.5.10'
  - '@biomejs/cli-linux-arm64@2.5.10'
  - '@biomejs/cli-linux-x64-musl@2.5.10'
  - '@biomejs/cli-linux-x64@2.5.10'
  - '@biomejs/cli-win32-arm64@2.5.10'
  - '@biomejs/cli-win32-x64@2.5.10'
  - nanoid@3.3.18
