packages:
  - apps/*
  - packages/*

engineStrict: true
savePrefix: ""

update:
  ignoreDeps:
    - '@effect/platform-node'
    - '@effect/tsgo'
    - '@effect/vitest'
    - '@biomejs/biome'
    - '@types/node'
    - '@typescript/native'
    - '@vitest/coverage-istanbul'
    - effect
    - node
    - typescript
    - ultracite
    - vitest

catalog:
  '@effect/platform-node': 4.0.0-rc.112
  '@effect/vitest': 4.0.0-rc.112
  '@mdx-js/mdx': 3.1.1
  '@types/estree-jsx': 1.0.5
  '@types/mdast': 4.0.4
  '@types/unist': 3.0.3
  '@vitest/coverage-istanbul': 4.1.11
  effect: 4.0.0-rc.112
  eslint-scope: 9.1.2
  estree-util-visit: 2.0.0
  mdast-util-mdx: 3.0.0
  mdast-util-to-string: 4.0.0
  remark-gfm: 4.0.1
  remark-math: 6.0.0
  typescript: npm:@typescript/typescript6@6.0.2
  unified: 11.0.5
  unist-util-visit: 5.1.0
  vitest: 4.1.11

overrides:
  '@effect/platform-node>undici': 8.10.2
  'postcss@8.5.25>nanoid': 3.3.18
  postcss: 8.5.25
  '@effect/platform-node-shared': 4.0.0-rc.112

allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  msgpackr-extract: false

minimumReleaseAgeExclude:
  - '@effect/tsgo-darwin-arm64@0.41.0'
  - '@effect/tsgo-darwin-x64@0.41.0'
  - '@effect/tsgo-linux-arm64@0.41.0'
  - '@effect/tsgo-linux-arm@0.41.0'
  - '@effect/tsgo-linux-x64@0.41.0'
  - '@effect/tsgo-win32-arm64@0.41.0'
  - '@effect/tsgo-win32-x64@0.41.0'
  - '@effect/tsgo@0.41.0'
  - ultracite@7.10.8
  - undici@8.10.2
